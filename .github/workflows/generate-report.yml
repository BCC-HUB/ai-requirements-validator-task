name: Generate report

# Ручной прогон агента в GitHub Actions: Actions → Generate report → Run workflow.
# Ключи берутся из секретов окружения (Settings → Environments → <окружение> → Environment secrets):
# GEMINI_API_KEY, CLAUDE_API_KEY, OPENROUTER_API_KEY, DEEPSEEK_API_KEY — достаточно одного.
# Отчёт выкладывается артефактом «requirements-report».
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Имя окружения GitHub с секретами-ключами"
        required: true
        type: string
      provider:
        description: "Провайдер LLM"
        type: choice
        default: gemini
        options: [gemini, anthropic, openrouter, deepseek]
      model:
        description: "Модель (пусто — модель провайдера по умолчанию)"
        required: false
        default: ""
      document:
        description: "Проверяемый документ"
        required: false
        default: docs/requirements.md

jobs:
  report:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужен коммит для паспорта прогона
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt anthropic
      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_DOCUMENT: ${{ inputs.document }}
          TZ: Asia/Almaty
          REQVALIDATOR_CACHE_DIR: ""
        run: |
          args=(--provider "$INPUT_PROVIDER")
          if [ -n "$INPUT_MODEL" ]; then args+=(--model "$INPUT_MODEL"); fi
          python -m reqvalidator "$INPUT_DOCUMENT" reports/requirements-report.md "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requirements-report
          path: reports/
          if-no-files-found: warn
