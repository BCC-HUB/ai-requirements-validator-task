[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reqvalidator"
description = "ИИ-агент статической проверки документа требований по ISO/IEC/IEEE 29148:2018 и IEEE Std 830-1998"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "azekowka" }]
dynamic = ["version"]
dependencies = [
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.14"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
reqvalidator = "reqvalidator.cli:main"

[tool.setuptools.dynamic]
version = { attr = "reqvalidator.__version__" }

[tool.setuptools.packages.find]
include = ["reqvalidator*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003: в проекте намеренно используются кириллица, «ёлочки» и типографские тире.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
